name: CI → Build → Deploy → Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Grant GITHUB_TOKEN write access for Pages deployment and release creation
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safetakeoff

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: safetakeoff/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

  # ── 2. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: safetakeoff

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: safetakeoff/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /STO-frontend/
          # Point the frontend at the Render-hosted backend
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: safetakeoff/dist

  # ── 3. Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── 4. Create GitHub Release ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./safetakeoff/package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}-${{ steps.sha.outputs.short }}
          name: "SafeTakeOff Frontend v${{ steps.pkg.outputs.version }} (${{ steps.sha.outputs.short }})"
          body: |
            ## 🛫 SafeTakeOff Frontend — Auto Release

            **Commit**: `${{ github.sha }}`
            **Branch**: `${{ github.ref_name }}`
            **Deployed to**: https://supulkalhara.github.io/STO-frontend/

            ### What's in this release
            Built from the latest `main` branch commit. See commit message for change details.

            ---
            *Auto-generated by GitHub Actions on every push to main.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
