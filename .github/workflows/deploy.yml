# CONTRIBUTING.md

Thank you for your interest in contributing to SafeTakeOff Frontend!

## How to Contribute

1. **Fork the Repository**: Click the 'Fork' button at the top right of this repository.
2. **Clone Your Fork**: Clone your forked repository to your local machine using `git clone https://github.com/your-username/safetakeoff.git`.
3. **Create a New Branch**: Create a new branch for your feature or bug fix using `git checkout -b feature/my-feature`.
4. **Make Changes**: Make the necessary changes to the codebase.
5. **Commit Your Changes**: Commit your changes with a descriptive commit message using `git commit -m 'Add my feature'`.
6. **Push to Your Fork**: Push your changes to your forked repository using `git push origin feature/my-feature`.
7. **Create a Pull Request**: Go to the original repository and click the 'New Pull Request' button. Select your forked branch and create the pull request.

## Code Style

- Follow the [Airbnb JavaScript style guide](https://github.com/airbnb/javascript).
- Ensure all code is well-tested with unit tests.

## Testing

Run `npm test` to execute the unit tests.

## Deployment

The deployment process is automated via GitHub Actions. Changes pushed to the `main` branch will trigger a build and deploy to GitHub Pages, as well as create a new release on GitHub.